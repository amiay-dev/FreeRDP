name: Kali-RDP

on:
  workflow_dispatch:

jobs:
  kali-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Desktop Environment & XRDP
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xrdp
          sudo systemctl enable xrdp
          sudo adduser xrdp ssl-cert
          
          # Configure XRDP to use XFCE
          echo "xfce4-session" > ~/.xsession
          sudo systemctl restart xrdp
      
      - name: Install Kali Tools
        run: |
          # Ajouter le repository Kali
          sudo apt-get install -y wget gnupg
          wget -q -O - https://archive.kali.org/archive-key.asc | sudo apt-key add -
          echo "deb http://http.kali.org/kali kali-rolling main contrib non-free" | sudo tee /etc/apt/sources.list.d/kali.list
          sudo apt-get update
          
          # Installer les outils Kali (exemples)
          sudo apt-get install -y kali-linux-core nmap metasploit-framework burpsuite
      
      - name: Create User
        run: |
          # Créer d'abord l'utilisateur kali
          sudo useradd -m -s /bin/bash amiay
          
          # Définir le mot de passe
          echo "amiay:Password123!" | sudo chpasswd
          
          # Ajouter aux groupes sudo
          sudo usermod -aG sudo amiay
      
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }}
          TAILSCALE_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> $GITHUB_ENV
      
      - name: Keep Alive
        run: |
          echo "=== KALI RDP ACCESS ==="
          echo "IP: $TAILSCALE_IP"
          echo "User: amiay"
          echo "Pass: Password123!"
          echo "======================="
          while true; do sleep 300; done
